- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      wb:
        displayName: "总管·本机wb代理"
        apiKeyEnv: WB_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:7864/v1
        models:
          - id: cn:hy3
            name: Hy3
            maxTokens: 64000
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: wb
    model: cn:hy3
